[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported (pytest-homeassistant README).
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Naive datetimes are fine in tests: entity code parses GitLab's ISO timestamps itself,
# and fixtures mirror exactly what the API returns.
"tests/*" = ["DTZ001"]
